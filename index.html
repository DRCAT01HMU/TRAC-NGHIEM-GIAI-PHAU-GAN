        const rawQuizData = `
CÂU HỎI TRẮC NGHIỆM GIẢI PHẪU GAN
TEAMDRCAT
Tài liệu được biên soạn dựa trên kiến thức chuẩn Y HÀ NỘI

Phần I: Giải phẫu Đại thể, Liên quan 
Câu 1. Gan là tạng lớn nhất cơ thể, chiếm bao nhiêu phần trăm trọng lượng cơ thể ở người trưởng thành?
A. 1%
B. 2%
C. 5%
D. 10%
Đáp án: B
Giải thích: Gan là tạng lớn nhất cơ thể, chiếm tới 2% trọng lượng cơ thể ở người trưởng thành và 5% ở trẻ mới sinh.

Câu 2. Đối chiếu lên thành ngực, giới hạn trên của gan ở bên phải tương ứng với khoang gian sườn nào, ngay dưới núm vú phải?
A. Khoang gian sườn 3
B. Khoang gian sườn 4
C. Khoang gian sườn 5
D. Khoang gian sườn 6
Đáp án: B
Giải thích: Giới hạn trên của gan được mô tả là một đường chạy lên trên và sang phải tới một điểm ở dưới núm vú phải, tương ứng với khoang gian sườn 4. Đây là điểm cao nhất của vòm gan phải.

Câu 3. Mặt hoành của gan được chia thành mấy phần?
A. 2 phần: trước và sau
B. 3 phần: trước, trên và phải
C. 4 phần: trước, trên, phải và sau
D. 5 phần: trước, trên, phải, sau và trái
Đáp án: C
Giải thích: Mặt hoành của gan lồi và áp sát vào cơ hoành. Dựa vào các chiều cong của nó, mặt hoành được chia thành bốn phần: trước, trên, phải và sau.

Câu 4. "Vùng trần" của gan là một vùng không được phúc mạc che phủ, nằm ở phần nào của mặt hoành?
A. Phần trước
B. Phần trên
C. Phần phải
D. Phần sau
Đáp án: D
Giải thích: Vùng trần là một vùng hình tam giác không được phúc mạc phủ, nằm ở phần sau của mặt hoành. Vùng này dính trực tiếp với cơ hoành bằng mô liên kết và được giới hạn bởi các lá của dây chằng vành.

Câu 5. Dây chằng tròn của gan là di tích của cấu trúc nào trong thời kỳ phôi thai?
A. Ống tĩnh mạch 
B. Tĩnh mạch rốn phải
C. Tĩnh mạch rốn trái
D. Động mạch rốn
Đáp án: C
Giải thích: Dây chằng tròn nằm trong khe dây chằng tròn ở mặt tạng và ở bờ tự do của dây chằng liềm. Nó là một tàn tích của tĩnh mạch rốn trái trong tuần hoàn phôi thai.

Câu 6. Cấu trúc nào sau đây KHÔNG phải là mốc giới để phân chia 4 thùy (phải, trái, vuông, đuôi) ở mặt tạng và mặt sau của gan?
A. Hố túi mật
B. Rãnh tĩnh mạch chủ dưới
C. Khe dây chằng tròn
D. Dây chằng liềm
Đáp án: D
Giải thích: Bốn thùy ở mặt dưới (mặt tạng và mặt sau) được ngăn cách bởi một hệ thống các rãnh và khe hình chữ H, bao gồm: hố túi mật, rãnh tĩnh mạch chủ dưới, khe dây chằng tròn, khe dây chằng tĩnh mạch và cửa gan. Dây chằng liềm là mốc phân chia thùy phải và thùy trái ở mặt hoành.

Câu 7. Mặt tạng của thùy gan trái có vết ấn của cơ quan nào?
A. Góc đại tràng phải và thận phải
B. Dạ dày và thực quản
C. Tá tràng và tụy
D. Lách và đại tràng ngang
Đáp án: B
Giải thích: Mặt tạng của thùy trái có hai vết ấn liên tiếp là ấn thực quản ở phía sau và ấn dạ dày ở phía trước, do đáy vị của dạ dày ấn vào.

Câu 8. Phương tiện nào được xem là phương tiện giữ gan tại chỗ quan trọng và chắc chắn nhất?
A. Dây chằng liềm
B. Dây chằng vành
C. Mạc nối nhỏ
D. Tĩnh mạch chủ dưới và các tĩnh mạch gan
Đáp án: D
Giải thích: Gan được giữ tại chỗ bởi nhiều phương tiện, nhưng sự kết nối chặt chẽ giữa các tĩnh mạch gan và tĩnh mạch chủ dưới, cùng với sự dính của vùng trần vào cơ hoành, là các yếu tố cố định chính và vững chắc nhất. Các dây chằng phúc mạc khác chỉ có vai trò thứ yếu.

Câu 9. Dây chằng tam giác trái được tạo nên bởi sự hợp lại của các lá dây chằng nào?
A. Dây chằng liềm
B. Dây chằng vành
C. Dây chằng tròn
D. Mạc nối nhỏ
Đáp án: B
Giải thích: Các lá trên và dưới của dây chằng vành chạy về hai phía của gan. Khi chúng tiến sát lại gần nhau ở đầu bên trái của gan, chúng hợp lại để tạo thành dây chằng tam giác trái.

Câu 10. Thùy vuông của gan liên quan chủ yếu với các cấu trúc nào sau đây?
A. Thận phải và tuyến thượng thận phải
B. Đáy vị dạ dày
C. Môn vị và phần trên tá tràng
D. Góc đại tràng phải
Đáp án: C
Giải thích: Thùy vuông nằm ở mặt tạng, phía trước cửa gan, giữa hố túi mật và khe dây chằng tròn. Nó liên quan mật thiết với môn vị của dạ dày và phần trên của tá tràng.

Câu 11. Ấn tim nằm ở phần nào của mặt hoành của gan?
A. Phần trước
B. Phần trên
C. Phần phải
D. Phần sau
Đáp án: B
Giải thích: Phần trên của mặt hoành lồi lên và áp sát vào vòm hoành. Ở giữa phần này có một vùng lõm nông gọi là ấn tim, tương ứng với vị trí của tim nằm trên trung tâm gân của cơ hoành.

Câu 12. Bờ dưới của gan có một khuyết đặc trưng do cấu trúc nào tạo nên?
A. Đáy túi mật
B. Tĩnh mạch chủ dưới
C. Dây chằng tròn
D. Cửa gan
Đáp án: C
Giải thích: Bờ dưới của gan là một bờ sắc. Trên bờ này có một khuyết gọi là khuyết dây chằng tròn, là nơi dây chằng tròn bám vào gan.

Câu 13. Cấu trúc nào nằm trong khe dây chằng tĩnh mạch?
A. Tàn tích của tĩnh mạch rốn trái
B. Tàn tích của ống tĩnh mạch 
C. Tĩnh mạch cửa
D. Tĩnh mạch gan giữa
Đáp án: B
Giải thích: Khe dây chằng tĩnh mạch ngăn cách thùy đuôi với thùy trái ở mặt sau. Khe này chứa dây chằng tĩnh mạch, là tàn tích của ống tĩnh mạch trong thời kỳ phôi thai, có chức năng nối tắt máu từ tĩnh mạch rốn vào tĩnh mạch chủ dưới.

Câu 14. Qua cơ hoành, phần phải của mặt hoành gan liên quan với phổi và màng phổi phải và các xương sườn nào?
A. Xương sườn V - IX
B. Xương sườn VI - X
C. Xương sườn VII - XI
D. Xương sườn VIII - XII
Đáp án: C
Giải thích: Phần phải của mặt hoành gan được vòm hoành phải ngăn cách với đáy phổi phải, màng phổi phải và các xương sườn từ VII đến XI ở đường nách giữa.

Câu 15. Trong phẫu thuật, để bộc lộ thực quản đoạn bụng, phẫu thuật viên thường cần phải cắt dây chằng nào sau đây?
A. Dây chằng liềm
B. Dây chằng tam giác phải
C. Dây chằng tam giác trái
D. Dây chằng vành
Đáp án: C
Giải thích: Dây chằng tam giác trái nằm ở phía trước thực quản đoạn bụng và đáy vị. Việc cắt dây chằng này cho phép phẫu thuật viên di động và lật thùy gan trái sang bên phải, từ đó bộc lộ rõ mặt trước của tâm vị và thực quản bụng.

Câu 16. (Case lâm sàng) Một bệnh nhân nam 45 tuổi nhập viện vì sốt cao, đau tức vùng hạ sườn phải. Siêu âm và CT scan bụng phát hiện một khối áp xe lớn ở mặt sau gan phải, sát cơ hoành. Vài ngày sau, bệnh nhân xuất hiện triệu chứng khó thở và tràn dịch màng phổi phải. Biến chứng này có khả năng xảy ra nhất do sự lan truyền nhiễm trùng qua cấu trúc giải phẫu nào?
A. Dây chằng vành
B. Tĩnh mạch chủ dưới
C. Vùng trần của gan
D. Dây chằng tam giác phải
Đáp án: C
Giải thích: Vùng trần của gan là vùng không có phúc mạc che phủ, dính trực tiếp vào cơ hoành qua mô liên kết lỏng lẻo. Một ổ áp xe ở vị trí này có thể dễ dàng phá vỡ lớp mô liên kết và cơ hoành, lan trực tiếp vào khoang màng phổi gây viêm mủ màng phổi hoặc tràn dịch màng phổi phản ứng. 

Câu 17. (Case lâm sàng) Một bệnh nhân bị tai nạn giao thông, chấn thương vùng bụng kín. Khám lâm sàng thấy có dấu hiệu "đau vai phải" (dấu hiệu Kehr). Dấu hiệu này được giải thích bởi sự kích thích của máu trong ổ bụng lên dây thần kinh nào chi phối cho bề mặt cơ hoành?
A. Dây thần kinh liên sườn
B. Dây thần kinh hoành
C. Dây thần kinh lang thang (phế vị)
D. Các nhánh của đám rối tạng
Đáp án: B
Giải thích: Dấu hiệu Kehr là hiện tượng đau quy chiếu lên vùng vai, gây ra bởi sự kích thích cơ hoành. Mặt hoành của gan liên quan mật thiết với cơ hoành. Cơ hoành được chi phối vận động và cảm giác bởi dây thần kinh hoành (xuất phát từ các rễ cổ C3, C4, C5).

Câu 18. Thùy đuôi của gan có hai mỏm đặc trưng là mỏm đuôi và mỏm nhú. Mỏm đuôi nằm ở bên nào?
A. Bên phải, gần rãnh tĩnh mạch chủ dưới
B. Bên trái, gần khe dây chằng tĩnh mạch
C. Phía trước, gần thùy vuông
D. Phía sau, gần vùng trần
Đáp án: A
Giải thích: Thùy đuôi nằm ở mặt sau, có hai mỏm nằm sát cửa gan. Mỏm đuôi nằm ở bên phải, nối thùy đuôi với thùy phải và nằm gần rãnh tĩnh mạch chủ dưới. Mỏm nhú nằm ở bên trái.

Câu 19. Bờ tự do của dây chằng liềm chứa cấu trúc nào sau đây?
A. Dây chằng tĩnh mạch và các tĩnh mạch cạnh rốn
B. Dây chằng tròn và các tĩnh mạch cạnh rốn
C. Động mạch gan riêng
D. Ống mật chủ
Đáp án: B
Giải thích: Dây chằng liềm có một bờ tự do đi từ rốn tới bờ dưới của gan. Bờ tự do này chứa dây chằng tròn (di tích tĩnh mạch rốn trái) và các tĩnh mạch cạnh rốn nhỏ đi kèm.

Câu 20. Vùng nào của gan thường không thể sờ thấy được khi khám bụng ở người bình thường nhưng có thể phát hiện bệnh lý qua phương pháp gõ?
A. Bờ dưới gan
B. Phần trước của mặt hoành nằm trong góc dưới ức
C. Đáy túi mật
D. Bờ phải của gan
Đáp án: B
Giải thích: Phần trước của mặt hoành có một vùng nằm ngay sau thành bụng trước, trong góc dưới ức. Ở người bình thường, vùng này nằm cao và được lồng ngực che phủ nên không sờ thấy. 

Phần II: Phân chia Gan theo Chức năng và Ngoại khoa 
Câu 21. Hệ thống phân chia gan của Couinaud dựa trên nguyên tắc chính nào?
A. Sự phân bố của các dây chằng trên bề mặt gan
B. Sự phân nhánh của tĩnh mạch cửa và sự sắp xếp của các tĩnh mạch gan
C. Sự phân nhánh của đường mật trong gan
D. Hình thể giải phẫu bên ngoài của các thùy gan
Đáp án: B

Câu 22. Khe cửa chính (khe giữa) chia gan thành hai nửa gan chức năng (phải và trái). Khe này chứa cấu trúc mạch máu nào?
A. Tĩnh mạch gan phải
B. Tĩnh mạch gan giữa
C. Tĩnh mạch gan trái
D. Nhánh chính của tĩnh mạch cửa
Đáp án: B

Câu 23. Theo phân loại của Couinaud, các tĩnh mạch gan (phải, giữa, trái) có vai trò gì trong phân chia gan?
A. Nằm ở trung tâm của mỗi phân thùy
B. Nằm trong các khe gian phân thùy, là mốc để phẫu thuật
C. Cung cấp máu cho các phân thùy
D. Dẫn lưu mật từ các phân thùy
Đáp án: B

Câu 24. Nửa gan phải được khe cửa phải chia thành hai phân khu. Phân khu giữa phải (phân khu trước) bao gồm các phân thùy nào?
A. Phân thùy VI và VII
B. Phân thùy V và VIII
C. Phân thùy IVa và IVb
D. Phân thùy II và III
Đáp án: B

Câu 25. Phân thùy nào còn được gọi là thùy đuôi?
A. Phân thùy I
B. Phân thùy II
C. Phân thùy IV
D. Phân thùy V
Đáp án: A

Câu 26. Khe rốn là mốc giải phẫu quan trọng ở gan trái, ngăn cách hai phân thùy nào?
A. Phân thùy II và III
B. Phân thùy III và IV
C. Phân thùy IV và V
D. Phân thùy I và IV
Đáp án: B

Câu 27. Tĩnh mạch gan trái nằm trong khe nào và ngăn cách các phân khu nào của gan trái?
A. Khe cửa chính, ngăn cách phân khu giữa phải và giữa trái
B. Khe cửa phải, ngăn cách phân khu bên phải và giữa phải
C. Khe cửa trái, ngăn cách phân khu giữa trái và bên trái
D. Khe rốn, ngăn cách phân thùy III và IV
Đáp án: C

Câu 28. Phân khu bên trái của gan bao gồm các phân thùy nào?
A. Chỉ phân thùy II
B. Chỉ phân thùy III
C. Phân thùy II và III
D. Phân thùy III và IV
Đáp án: C

Câu 29. Trong cách phân chia của Tôn Thất Tùng, nửa gan trái được chia thành các phân thùy giữa và bên bởi khe nào?
A. Khe cửa chính
B. Khe cửa trái
C. Khe rốn
D. Khe tĩnh mạch chủ
Đáp án: C

Câu 30. Phân thùy nào nằm ngay phía trên và phía sau của phân thùy V?
A. Phân thùy IV
B. Phân thùy VI
C. Phân thùy VII
D. Phân thùy VIII
Đáp án: D

Câu 31. (Case lâm sàng) Một bệnh nhân được chẩn đoán có khối u gan ác tính (HCC) đường kính 4 cm, khu trú hoàn toàn trong phân thùy VI. Phẫu thuật viên lên kế hoạch cắt phân thùy VI. Trong quá trình phẫu thuật, sau khi đã kẹp cuống mạch máu-mật của phân thùy VI, phẫu thuật viên sẽ thực hiện đường cắt nhu mô gan dọc theo mặt phẳng chứa tĩnh mạch nào?
A. Tĩnh mạch gan giữa
B. Tĩnh mạch gan phải
C. Nhánh sau của tĩnh mạch cửa phải
D. Tĩnh mạch gan trái
Đáp án: B

        `;

        function parseQuizData(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const questions = [];
            let currentQ = null;
            let skipMode = true;

            lines.forEach(line => {
                const isOptionA = line.match(/^A[\.\)]\s*(.*)/i);
                const isOptionB = line.match(/^B[\.\)]\s*(.*)/i);
                const isOptionC = line.match(/^C[\.\)]\s*(.*)/i);
                const isOptionD = line.match(/^D[\.\)]\s*(.*)/i);
                const isAnswer = line.match(/^Đáp án(?: đúng)?:\s*([A-D])/i);
                const isQuestionHeader = line.match(/^Câu\s*(\d+)(?:[\.\:]\s*(.*))?/i);

                if (isQuestionHeader) {
                    skipMode = false;
                    let id = isQuestionHeader[1];
                    let textPart = isQuestionHeader[2] || '';
                    currentQ = { id: id, question: textPart, options: {}, answer: '' };
                } else if (isAnswer) {
                    if (currentQ) {
                        currentQ.answer = isAnswer[1].toUpperCase();
                        questions.push(currentQ);
                        currentQ = null;
                        skipMode = true; 
                    }
                } else if (!skipMode && currentQ) {
                    if (isOptionA) currentQ.options['A'] = isOptionA[1].trim();
                    else if (isOptionB) currentQ.options['B'] = isOptionB[1].trim();
                    else if (isOptionC) currentQ.options['C'] = isOptionC[1].trim();
                    else if (isOptionD) currentQ.options['D'] = isOptionD[1].trim();
                    else if (!line.match(/^(CÂU HỎI TRẮC NGHIỆM|TEAMDRCAT|Tài liệu|Phần|Mục|Bảng)/i)) {
                        currentQ.question += (currentQ.question ? ' ' : '') + line;
                    }
                }
            });
            return questions;
        }

            const [questions, setQuestions] = useState([]);

            const [flagged, setFlagged] = useState(new Set());
            const [timeRemaining, setTimeRemaining] = useState(90 * 60); 
            const [showMatrix, setShowMatrix] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            
            const scrollContainerRef = useRef(null);

            useEffect(() => {
                setQuestions(parseQuizData(rawQuizData));
            }, []);

                    scrollContainerRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, [appState]);

            useEffect(() => {
                let timer;
                if (appState === 'quiz' && !isPaused && timeRemaining > 0) {

                } else if (timeRemaining <= 0 && appState === 'quiz') {
                    setAppState('result');
                }
                return () => clearInterval(timer);
            }, [appState, timeRemaining, isPaused]);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

                                            <div className="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
                                            <div className="w-24 h-24 bg-emerald-500 text-white rounded-full flex items-center justify-center text-5xl mx-auto mb-6 shadow-lg border-4 border-emerald-50"><i className="fa-solid fa-shield-halved text-4xl"></i></div>
                                            <h2 className="text-3xl font-black text-slate-800 mb-6">Hoàn thành bài test!</h2>
                                            {msg && <div className={`p-6 rounded-2xl border mb-8 flex flex-col items-center gap-2 ${msg.color}`}><i className={`fa-solid ${msg.icon} text-4xl mb-1 opacity-80`}></i><h3 className="text-xl font-black uppercase tracking-wide">{msg.title}</h3><p className="text-base font-medium opacity-90 max-w-lg">{msg.text}</p></div>}
                                            <div className="flex flex-col items-center gap-1 mb-8"><div className="flex items-baseline gap-2"><span className="text-7xl font-black text-slate-900 tracking-tighter">{calculateScore()}</span><span className="text-2xl font-bold text-slate-300">/ {questions.length}</span></div><p className="text-slate-400 font-bold uppercase tracking-widest text-xs">Điểm số của bạn</p></div>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-10">
                                                <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100"><p className="text-[10px] font-black text-emerald-600 uppercase mb-1">Đúng</p><p className="text-xl font-black text-emerald-700">{calculateScore()}</p></div>
                                                <div className="bg-red-50 p-3 rounded-xl border border-red-100"><p className="text-[10px] font-black text-red-600 uppercase mb-1">Sai</p><p className="text-xl font-black text-red-700">{Object.keys(answers).length - calculateScore()}</p></div>
                                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><p className="text-[10px] font-black text-slate-400 uppercase mb-1">Bỏ qua</p><p className="text-xl font-black text-slate-500">{questions.length - Object.keys(answers).length}</p></div>
                                                <div className="bg-orange-50 p-3 rounded-xl border border-orange-100"><p className="text-[10px] font-black text-orange-600 uppercase mb-1">Cờ</p><p className="text-xl font-black text-orange-700">{flagged.size}</p></div>
                                            </div>
                                            <button onClick={restartQuiz} className="w-full bg-slate-900 hover:bg-slate-800 text-white text-lg font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg hover:shadow-slate-500/30 uppercase tracking-wide mb-3"><i className="fa-solid fa-rotate-right text-xl"></i> Làm lại bài test</button>
                                            <button onClick={() => { setAppState('review'); setCurrentIndex(0); }} className="w-full bg-cyan-100 hover:bg-cyan-200 text-cyan-700 text-lg font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all uppercase tracking-wide"><i className="fa-solid fa-eye text-xl"></i> Xem lại bài làm</button>
                                        </div>
                                    </div>
                                ) : appState === 'review' ? (
                                    <div className="space-y-6 animate-in fade-in duration-300">
                                        <div className="bg-orange-50 p-4 rounded-2xl border border-orange-200 flex items-center justify-between shadow-sm sticky top-0 z-20"><h2 className="text-lg font-black text-orange-800 uppercase tracking-tight"><i className="fa-solid fa-list-check mr-2"></i> Danh sách tất cả câu hỏi</h2></div>
                                        {questions.map((q, index) => {
                                            const isSelected = !!answers[index];
                                            const isCorrect = answers[index] === q.answer;
                                            return (
                                                <div key={index} id={`review-q-${index}`} className={`bg-white rounded-[1.5rem] shadow-sm border-2 p-6 md:p-8 relative overflow-hidden ${isSelected ? (isCorrect ? 'border-emerald-200' : 'border-red-200') : 'border-slate-200'}`}>
                                                    <div className="flex justify-between items-center mb-6">
                                                        <div className="flex items-center gap-3">
                                                            <span className={`px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest text-white shadow-sm ${isSelected ? (isCorrect ? 'bg-emerald-500' : 'bg-red-500') : 'bg-slate-400'}`}>Câu {q.id}</span>
                                                            {isSelected ? (isCorrect ? <span className="text-emerald-600 font-bold text-sm"><i className="fa-solid fa-check mr-1"></i>Đúng</span> : <span className="text-red-600 font-bold text-sm"><i className="fa-solid fa-xmark mr-1"></i>Sai</span>) : <span className="text-slate-500 font-bold text-sm"><i className="fa-solid fa-minus mr-1"></i>Chưa trả lời</span>}
                                                        </div>
                                                    </div>
                                                    <h3 className="text-lg md:text-xl font-bold text-slate-800 leading-snug mb-6">{q.question}</h3>
                                                    <div className="grid gap-3">
                                                        {['A', 'B', 'C', 'D'].map(key => {
                                                            const label = q.options[key];
                                                            if (!label) return null;
                                                            const isUserChoice = answers[index] === key;
                                                            const isCorrectOption = q.answer === key;
                                                            let stateStyle = "border-slate-200 bg-slate-50 text-slate-500 opacity-70 grayscale";
                                                            if (isCorrectOption) stateStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm ring-1 ring-emerald-500";
                                                            else if (isUserChoice) stateStyle = "bg-red-50 border-red-500 text-red-800 shadow-sm";
                                                            return (
                                                                <div key={key} className={`w-full p-4 rounded-xl border-2 text-left flex items-center gap-4 relative ${stateStyle}`}>
                                                                    <span className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-base shrink-0 ${isCorrectOption ? 'bg-emerald-500 text-white border-emerald-500' : isUserChoice ? 'bg-red-500 text-white border-red-500' : 'bg-white text-slate-500 border-2 border-slate-200'}`}>{key}</span>
                                                                    <span className="text-base font-medium leading-normal flex-1 pr-8">{label}</span>
                                                                    {isCorrectOption && <i className="fa-solid fa-circle-check text-2xl text-emerald-500 absolute right-4 top-1/2 -translate-y-1/2"></i>}
                                                                    {isUserChoice && !isCorrectOption && <i className="fa-solid fa-circle-xmark text-2xl text-red-500 absolute right-4 top-1/2 -translate-y-1/2"></i>}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-[1.5rem] shadow-sm border border-slate-200 p-6 md:p-8 relative overflow-hidden">
                                            <div className="flex justify-between items-center mb-6">
                                                <div className="flex items-center gap-2">
                                                    <span className="bg-cyan-600 text-white px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest shadow-sm">Câu {currentQ?.id}</span>
                                                    <span className="text-slate-400 font-bold text-xs tracking-widest uppercase">/ {questions.length}</span>
                                                </div>
                                                <button onClick={toggleFlag} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border ${flagged.has(currentIndex) ? 'bg-orange-50 border-orange-400 text-orange-600' : 'bg-white border-slate-200 text-slate-400 hover:text-slate-600'}`}><i className="fa-solid fa-flag text-sm"></i><span className="hidden sm:inline">Đánh dấu</span></button>
                                            </div>
                                            <h3 className="text-lg md:text-xl font-bold text-slate-800 leading-snug mb-6">{currentQ?.question}</h3>
                                            <div className="grid gap-3">
                                                {['A', 'B', 'C', 'D'].map(key => {
                                                    const label = currentQ?.options[key];
                                                    if (!label) return null;
                                                    const isSelected = answers[currentIndex] === key;
                                                    const isCorrect = currentQ.answer === key;
                                                    const showAnswerState = hasAnsweredCurrent;
                                                    let stateStyle = "border-slate-200 bg-white hover:border-cyan-300 hover:bg-cyan-50/50";
                                                    if (showAnswerState) {
                                                        if (isCorrect) stateStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                                                        else if (isSelected) stateStyle = "bg-red-50 border-red-500 text-red-800 shadow-sm";
                                                        else stateStyle = "opacity-50 border-slate-100 bg-slate-50 grayscale";
                                                    }
                                                    return (
                                                        <button key={key} onClick={() => handleSelectAnswer(key)} disabled={showAnswerState} className={`group w-full p-4 rounded-xl border-2 text-left flex items-center gap-4 option-transition relative ${stateStyle}`}>
                                                            <span className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-base shrink-0 transition-all ${showAnswerState ? (isCorrect ? 'bg-emerald-500 text-white border-emerald-500' : isSelected ? 'bg-red-500 text-white border-red-500' : 'bg-slate-200 text-slate-400 border-slate-200') : 'bg-white text-slate-500 border-2 border-slate-200 group-hover:bg-cyan-600 group-hover:text-white group-hover:border-cyan-600'}`}>{key}</span>
                                                            <span className="text-base font-medium leading-normal flex-1 pr-8">{label}</span>
                                                            {showAnswerState && isCorrect && <i className="fa-solid fa-circle-check text-2xl text-emerald-500 absolute right-4 top-1/2 -translate-y-1/2"></i>}
                                                            {showAnswerState && isSelected && !isCorrect && <i className="fa-solid fa-circle-xmark text-2xl text-red-500 absolute right-4 top-1/2 -translate-y-1/2"></i>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        <div className="flex items-center justify-between gap-4 pt-4 pb-20 md:pb-4">
                                            <button onClick={() => setCurrentIndex(p => Math.max(0, p - 1))} disabled={currentIndex === 0} className="flex-1 bg-white border border-slate-200 px-6 py-3.5 rounded-xl font-bold text-slate-500 hover:text-slate-800 disabled:opacity-0 transition-all flex items-center justify-center gap-2 uppercase tracking-wide text-xs"><i className="fa-solid fa-chevron-left text-sm"></i> <span className="hidden sm:inline">Câu trước</span></button>
                                            <button onClick={() => setCurrentIndex(p => Math.min(questions.length - 1, p + 1))} disabled={currentIndex === questions.length - 1} className="flex-1 bg-white border border-slate-200 px-6 py-3.5 rounded-xl font-bold text-slate-800 hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm flex items-center justify-center gap-2 uppercase tracking-wide text-xs"><span className="hidden sm:inline">Câu tiếp</span> <i className="fa-solid fa-chevron-right text-sm"></i></button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
